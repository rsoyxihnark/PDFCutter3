name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check the version and the changelog
        id: gate
        shell: python
        run: |
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          SOURCE = "PDF_Cutter.py"
          CHANGELOG = "CHANGELOG.md"


          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, encoding="utf-8", check=True).stdout


          def read_text(path):
              raw = Path(path).read_bytes().decode("utf-8")
              return raw.replace("\r\n", "\n").replace("\r", "\n")


          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)


          def set_output(name, value):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")


          def bullets(lines):
              return [line.strip() for line in lines if line.strip().startswith("- ")]


          def changelog_entries(text, heading):
              collected = []
              inside = False
              for line in text.split("\n"):
                  if line.startswith("##"):
                      inside = re.fullmatch(rf"##\s+{re.escape(heading)}\s*", line) is not None
                      continue
                  if inside:
                      collected.append(line)
              return bullets(collected)


          found = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', read_text(SOURCE), re.MULTILINE)
          if not found:
              fail(f"{SOURCE} has no APP_VERSION line to read the version from.")
          version = found.group(1).strip()

          subject = git("log", "-1", "--pretty=%s").strip()
          body = git("log", "-1", "--pretty=%b").strip()

          if git("log", "-1", "--pretty=%P").split():
              changed = git("diff", "--name-only", "HEAD^", "HEAD")
          else:
              changed = git("show", "--pretty=", "--name-only", "HEAD")
          changed = [line.strip() for line in changed.split("\n") if line.strip()]

          labelled = re.match(r"\[([^\]]+)\]", subject)
          if not labelled:
              fail("The commit subject has to start with the version in square brackets, or with [no release].")
          label = labelled.group(1).strip()

          set_output("version", version)

          if label == "no release":
              set_output("release", "false")
              print(f"Building {version} from a [no release] commit. Nothing will be published.")
              sys.exit(0)

          if label != version:
              fail(f"The commit subject says {label} but {SOURCE} says {version}.")
          if CHANGELOG not in changed:
              fail(f"A commit that ships a version has to write its entries into {CHANGELOG}.")
          if not body:
              fail("A commit that ships a version needs a body, because the body is published as the release notes.")

          changelog = read_text(CHANGELOG)
          entries = changelog_entries(changelog, version)
          if not re.search(rf"^##\s+{re.escape(version)}\s*$", changelog, re.MULTILINE):
              fail(f"{CHANGELOG} has no section of its own for {version}.")
          if re.search(r"^##\s+unreleased\s*$", changelog, re.MULTILINE | re.IGNORECASE):
              fail("A commit that ships a version leaves no Unreleased heading behind it.")
          if entries != bullets(body.split("\n")):
              fail(f"The {version} section of {CHANGELOG} and the commit body have to say the same thing in the same words.")

          tag = f"v{version}"
          if git("ls-remote", "--tags", "origin", f"refs/tags/{tag}").strip():
              fail(f"{tag} has already been published, so ship the fix under the next version instead.")

          notes = Path(os.environ["RUNNER_TEMP"]) / "release_notes.md"
          notes.write_text(body + "\n", encoding="utf-8")

          set_output("release", "true")
          set_output("tag", tag)
          set_output("notes", str(notes))
          print(f"Publishing {tag}.")

      - name: Install the dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade pyinstaller
          pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

      - name: Write the version details Windows reads off the exe
        shell: python
        env:
          APP_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          import os
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          parts = [int(part) for part in version.split(".")]
          numbers = tuple((parts + [0, 0, 0, 0])[:4])

          resource = f"""VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={numbers},
              prodvers={numbers},
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
            ),
            kids=[
              StringFileInfo([
                StringTable(
                  "040904B0",
                  [StringStruct("FileDescription", "PDF Cutter"),
                   StringStruct("FileVersion", "{version}"),
                   StringStruct("InternalName", "PDF_Cutter"),
                   StringStruct("OriginalFilename", "PDF_Cutter.exe"),
                   StringStruct("ProductName", "PDF Cutter"),
                   StringStruct("ProductVersion", "{version}")])
              ]),
              VarFileInfo([VarStruct("Translation", [1033, 1200])])
            ]
          )
          """

          written = Path(os.environ["RUNNER_TEMP"], "version_info.txt")
          written.write_text(resource, encoding="utf-8")
          print(f"PDF_Cutter.exe will report version {version}.")

      - name: Draw the icon PDF_Cutter.exe shows
        shell: python
        run: |
          import os
          import struct
          import sys
          from pathlib import Path

          sys.path.insert(0, os.getcwd())
          from PDF_Cutter import render_app_icon_png

          sizes = (16, 24, 32, 48, 64, 128, 256)
          images = [render_app_icon_png(size) for size in sizes]
          header = struct.pack("<HHH", 0, 1, len(images))
          offset = len(header) + 16 * len(images)
          entries = b""
          for size, image in zip(sizes, images):
              entries += struct.pack("<BBBBHHII", size % 256, size % 256, 0, 0, 1, 32, len(image), offset)
              offset += len(image)

          written = Path(os.environ["RUNNER_TEMP"], "PDF_Cutter.ico")
          written.write_bytes(header + entries + b"".join(images))
          print(f"PDF_Cutter.exe will carry a {len(sizes)} size icon of {written.stat().st_size} bytes.")

      - name: Build PDF Cutter
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PDF_Cutter
          --version-file "${{ runner.temp }}/version_info.txt"
          --icon "${{ runner.temp }}/PDF_Cutter.ico"
          --collect-all ttkbootstrap
          --collect-all tkinterdnd2
          PDF_Cutter.py

      - name: Check the download was produced
        env:
          APP_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          if (-not (Test-Path 'dist/PDF_Cutter.exe')) { throw 'The build produced no PDF_Cutter.exe.' }
          $details = (Get-Item 'dist/PDF_Cutter.exe').VersionInfo
          $version = $env:APP_VERSION
          $padded = (($version.Split('.') + @('0', '0', '0', '0'))[0..3]) -join '.'
          if ($details.FileVersion -ne $version -and $details.FileVersion -ne $padded) {
            throw "PDF_Cutter.exe reports its file version as '$($details.FileVersion)' instead of '$version'."
          }
          if ($details.ProductName -ne 'PDF Cutter') {
            throw "PDF_Cutter.exe reports its product name as '$($details.ProductName)' instead of 'PDF Cutter'."
          }
          Get-Item 'dist/PDF_Cutter.exe' | Format-List Name, Length
          $details | Format-List FileDescription, FileVersion, ProductName, ProductVersion

      - name: Publish the release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          name: ${{ steps.gate.outputs.tag }}
          body_path: ${{ steps.gate.outputs.notes }}
          files: dist/PDF_Cutter.exe
          fail_on_unmatched_files: true
